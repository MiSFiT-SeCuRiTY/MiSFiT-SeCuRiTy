<svg xmlns="http://www.w3.org/2000/svg"
     width="900"
     height="360"
     viewBox="0 0 900 360">

  <defs>
    <linearGradient id="bg" x2="0" y2="1">
      <stop offset="0%" stop-color="#080d14"/>
      <stop offset="100%" stop-color="#020408"/>
    </linearGradient>

    <pattern id="grid"
             width="30"
             height="30"
             patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30"
            fill="none"
            stroke="#172630"
            stroke-width="1"/>
    </pattern>

    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900"
        height="360"
        rx="14"
        fill="url(#bg)"/>

  <rect width="900"
        height="360"
        rx="14"
        fill="url(#grid)"
        stroke="#536773"/>

  <!-- Header -->
  <text x="28"
        y="38"
        fill="#e6eef2"
        font-family="monospace"
        font-size="23"
        font-weight="bold">
    CYBER SNAKE
  </text>

  <text x="700"
        y="36"
        fill="#7f929e"
        font-family="monospace"
        font-size="13">
    MISFiT // GAME
  </text>

  <!-- Game boundary -->
  <rect x="90"
        y="75"
        width="720"
        height="210"
        rx="8"
        fill="none"
        stroke="#304b58"
        stroke-width="2"/>

  <!-- Food -->
  <circle cx="450"
          cy="135"
          r="7"
          fill="#d85c6a"
          filter="url(#glow)">

    <animate attributeName="r"
             values="6;11;6"
             dur="1s"
             repeatCount="indefinite"/>

    <animate attributeName="opacity"
             values="1;.45;1"
             dur="1s"
             repeatCount="indefinite"/>
  </circle>

  <!-- Snake -->
  <g fill="#dbe8ed"
     filter="url(#glow)">

    <!-- Head -->
    <circle r="10">
      <animateMotion
        dur="7s"
        repeatCount="indefinite"
        path="M140 105
              H760
              V255
              H140
              V105"/>
    </circle>

    <!-- Body -->
    <circle r="8">
      <animateMotion
        dur="7s"
        begin="-0.15s"
        repeatCount="indefinite"
        path="M140 105
              H760
              V255
              H140
              V105"/>
    </circle>

    <circle r="7">
      <animateMotion
        dur="7s"
        begin="-0.30s"
        repeatCount="indefinite"
        path="M140 105
              H760
              V255
              H140
              V105"/>
    </circle>

    <circle r="6">
      <animateMotion
        dur="7s"
        begin="-0.45s"
        repeatCount="indefinite"
        path="M140 105
              H760
              V255
              H140
              V105"/>
    </circle>

    <circle r="5">
      <animateMotion
        dur="7s"
        begin="-0.60s"
        repeatCount="indefinite"
        path="M140 105
              H760
              V255
              H140
              V105"/>
    </circle>

    <circle r="4">
      <animateMotion
        dur="7s"
        begin="-0.75s"
        repeatCount="indefinite"
        path="M140 105
              H760
              V255
              H140
              V105"/>
    </circle>

  </g>

  <!-- HUD -->
  <text x="30"
        y="325"
        fill="#a8bac4"
        font-family="monospace"
        font-size="14">

    SCORE: 00420
    &#160;&#160;STATUS: ACTIVE
    &#160;&#160;MODE: CYBER

  </text>

  <!-- Blinking status -->
  <circle cx="850"
          cy="320"
          r="5"
          fill="#d85c6a">

    <animate attributeName="opacity"
             values="1;.2;1"
             dur=".8s"
             repeatCount="indefinite"/>
  </circle>

</svg>
